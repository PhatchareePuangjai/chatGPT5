services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imsd02 -d imsd02"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: imsd02
      POSTGRES_USER: imsd02
      POSTGRES_PASSWORD: imsd02
    depends_on:
      postgres:
        condition: service_healthy
