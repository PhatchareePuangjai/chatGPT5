services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    command: sh -c "npm ci && npm run dev"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
