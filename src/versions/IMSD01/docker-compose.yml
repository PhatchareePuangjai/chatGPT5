services:
  postgres:
    image: postgres:16
    container_name: imsd01-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imsd01
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imsd01"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - imsd01_pgdata:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/imsd01
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm ci && npm run migrate && npm run dev"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  imsd01_pgdata:
